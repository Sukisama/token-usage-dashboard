<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TokenDash</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <!-- ============ Sidebar ============ -->
    <nav class="sidebar">
      <div class="sidebar-logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M12 2L2 7v10l10 5 10-5V7L12 2z" stroke="currentColor" stroke-width="2"
                stroke-linejoin="round" opacity="0.9"/>
          <path d="M12 12l10-5M12 12v10M12 12L2 7" stroke="currentColor" stroke-width="2"
                stroke-linejoin="round" opacity="0.5"/>
        </svg>
      </div>
      <div class="nav-items">
        <a class="nav-item active" data-page="overview" href="#/overview" title="概览">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <rect x="3" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/>
            <rect x="14" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/>
            <rect x="3" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/>
            <rect x="14" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="2"/>
          </svg>
          <span class="nav-label">概览</span>
        </a>
        <a class="nav-item" data-page="agents" href="#/agents" title="Agent 分析">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2"/>
            <path d="M4 20c0-4 4-6 8-6s8 2 8 6" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round"/>
          </svg>
          <span class="nav-label">Agent</span>
        </a>
        <a class="nav-item" data-page="cost" href="#/cost" title="成本中心">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M12 2v20M17 5H9.5a3.5 3.5 0 100 7h5a3.5 3.5 0 110 7H6"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round"
                  stroke-linejoin="round"/>
          </svg>
          <span class="nav-label">成本</span>
        </a>
        <a class="nav-item" data-page="settings" href="#/settings" title="设置">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
            <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round"
                  stroke-linejoin="round"/>
          </svg>
          <span class="nav-label">设置</span>
        </a>
      </div>
      <div class="sidebar-bottom">
        <button id="scanBtnSide" class="nav-item scan-side" title="立即同步">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M21 2v6h-6M3 12a9 9 0 0115-6.7L21 8M3 22v-6h6M21 12a9 9 0 01-15 6.7L3 16"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round"
                  stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </nav>

    <!-- ============ Main ============ -->
    <main class="main-area">
      <div id="scanStatus" class="scan-status"></div>
      <div id="page-container" class="page-container"></div>
    </main>
  </div>

  <!-- ============ Scripts (dependency order) ============ -->
  <script src="core/format.js"></script>
  <script src="core/api.js"></script>
  <script src="core/router.js"></script>
  <script src="shared/trend-chart.js"></script>
  <script src="shared/heatmap.js"></script>
  <script src="shared/summary-cards.js"></script>
  <script src="shared/hourly-chart.js"></script>
  <script src="shared/drill-modal.js"></script>
  <script src="pages/overview.js"></script>
  <script src="pages/agents.js"></script>
  <script src="pages/cost.js"></script>
  <script src="pages/settings.js"></script>
  <script src="main.js"></script>
</body>
</html>
